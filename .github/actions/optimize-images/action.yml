name: Optimize images
description: Generate lossless WebP images and responsive hero thumbnails
# The regression suite deliberately does NOT run here. It gates pull requests
# instead (pr-build.yml), so a broken optimizer is caught before it reaches
# main rather than in the middle of a production deploy.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install -r .github/scripts/image-requirements.txt
    - shell: bash
      run: python .github/scripts/optimize-images.py
