name: Optimize images
description: Generate pixel-verified lossless WebP images and responsive hero thumbnails
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install -r .github/scripts/image-requirements.txt
    - shell: bash
      run: python .github/scripts/test-optimize-images.py
    - shell: bash
      run: python .github/scripts/optimize-images.py
