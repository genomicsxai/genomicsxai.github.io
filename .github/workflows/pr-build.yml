name: Build Check

on:
  pull_request:
  push:
    branches-ignore: [gh-pages, editors-ledger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Generate lossless images and card thumbnails
        uses: ./.github/actions/optimize-images

      - uses: peaceiris/actions-hugo@v3
        with:
          extended: true

      - run: hugo --minify

      - name: Validate Google Scholar metadata
        run: |
          ruby .github/scripts/validate-scholar-metadata.rb
